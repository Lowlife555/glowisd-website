<!-- 首次进入语言选择弹窗：仅首次访问（无 lang_chosen cookie）、非爬虫时由服务端渲染 -->
<div class="lang-modal" id="lang-modal" role="dialog" aria-modal="true" aria-labelledby="lang-modal-title">
  <div class="lang-modal-card">
    <button type="button" class="lang-modal-close" data-close-modal aria-label="关闭 Close إغلاق">×</button>
    <p class="lang-modal-eyebrow">GLOWISD</p>
    <h2 class="lang-modal-title" id="lang-modal-title">请选择语言 · Choose your language · اختر اللغة</h2>
    <div class="lang-modal-options">
      <button type="button" class="lang-modal-btn" data-pick-lang="zh">
        <span class="lm-native">中文</span><span class="lm-label">简体中文</span>
      </button>
      <button type="button" class="lang-modal-btn" data-pick-lang="en">
        <span class="lm-native">English</span><span class="lm-label">English</span>
      </button>
      <button type="button" class="lang-modal-btn" data-pick-lang="ar">
        <span class="lm-native">العربية</span><span class="lm-label">Arabic</span>
      </button>
    </div>
    <p class="lang-modal-hint">选择后可随时在右上角切换语言。<br>You can switch languages anytime in the top-right corner.</p>
  </div>
</div>
