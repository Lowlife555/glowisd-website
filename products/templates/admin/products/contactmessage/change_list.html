{% extends "admin/change_list.html" %}

{% block content %}
    <div style="margin:18px 22px 0;background:#fff;border:1px solid #e4e9f5;border-radius:4px;padding:16px 18px;">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
            <span style="font-size:15px;font-weight:700;color:#162A87;">按国家分组统计</span>
            <span style="font-size:13px;color:#5a6b9e;">共 {{ cl.country_stats.total }} 条询价</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;">
            {% for c in cl.country_stats.top %}
            <div style="min-width:130px;background:#F4F6FB;border:1px solid #e4e9f5;border-radius:4px;padding:10px 14px;">
                <div style="font-size:20px;font-weight:700;color:#162A87;">{{ c.count }}</div>
                <div style="font-size:13px;color:#5a6b9e;margin-top:2px;">{{ c.country }}</div>
            </div>
            {% empty %}
            <div style="font-size:13px;color:#5a6b9e;">暂无带国家的询价数据</div>
            {% endfor %}
        </div>
    </div>
    {{ block.super }}
{% endblock %}
