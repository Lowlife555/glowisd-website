{% extends "admin/change_form.html" %}
{% load products_extras %}

{% block form_top %}
{% if original and not add %}
{% product_completeness original as completeness %}
<div style="margin:6px 0 16px;background:#fff;border:1px solid #e4e9f5;border-radius:4px;padding:14px 18px;">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
    <span style="font-size:13px;font-weight:700;color:#162A87;white-space:nowrap;">资料完整度</span>
    <div style="flex:1;min-width:200px;background:#F4F6FB;border-radius:999px;height:14px;overflow:hidden;">
      <div style="width:{{ completeness }}%;height:100%;background:#27AE60;border-radius:999px;"></div>
    </div>
    <span style="font-size:15px;font-weight:700;color:#27AE60;white-space:nowrap;">{{ completeness }}%</span>
  </div>
</div>
{% endif %}
{{ block.super }}
{% endblock %}
