# Glowisd 官网 — nginx 站点配置（独立端口 8080，与雅思的 80 端口并存）
# 服务器部署位置: /etc/nginx/sites-available/glowisd
#                 软链 -> /etc/nginx/sites-enabled/glowisd
# 作用: 反代 gunicorn (127.0.0.1:8000) + 直接 serve 静态/媒体文件
# V0.3.9 缓存策略: 全站 no-cache + ETag/304 校验，网站更新后访客立即可见

server {
    listen 0.0.0.0:8080;
    server_name _;

    # —— 安全加固建议（P2 信息泄露收敛）——
    # 1) server_tokens off;              # 隐藏 nginx 版本号
    # 2) 反代块内加 proxy_hide_header Server;  # 隐藏后端 WSGI/gunicorn 的 Server 头
    #    （Django runserver 会暴露 "Server: WSGIServer/0.2 CPython/x.y.z" 精确 Python 版本，
    #      生产用 gunicorn+nginx 后建议隐藏；见下方 location / 的 proxy_hide_header 示例）
    # 说明：此处仅作示例注释，未改动生产服务器；实际启用时取消注释并 nginx -t + reload。

    client_max_body_size 20M;   # 产品照片 / 询价表单上传上限

    # collectstatic 产物（deploy 脚本 [5/6] 生成到 staticfiles/）
    location /static/ {
        alias /var/www/glowisd/staticfiles/;
        expires -1;             # no-cache: 每次 304 校验，logo/CSS 更新立即生效
    }

    # 产品照片（git 仓库中的 media/）
    location /media/ {
        alias /var/www/glowisd/media/;
        expires -1;             # no-cache: 产品图/水印更新立即生效
    }

    # 其余请求 → gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        # 注意:必须用 $http_host(保留端口),不能用 $host(丢端口)。
        # Django 6.1 CSRF Origin 校验是严格字符串比较,Django 期望的 Origin
        # 基于 Host 头;丢端口会导致浏览器 Origin(http://IP:8080) 与期望值
        # (http://IP) 不匹配 → 后台登录/所有 POST 一律 403 CSRF 失败。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用覆盖模式（$remote_addr）而非追加模式（$proxy_add_x_forwarded_for）：
        # 后台登录限流按 X-Forwarded-For 首个值取 IP，追加模式会把客户端伪造的
        # X-Forwarded-For 头拼在前面 → 攻击者每发一次请求换一个假 IP → 限流被绕过。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        # proxy_hide_header Server;   # 安全加固建议（取消注释可隐藏后端 Server 头，见文件顶部说明）
        add_header Cache-Control "no-cache";   # HTML 页面每次校验，不缓存旧版
    }
}
