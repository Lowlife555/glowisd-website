# Glowisd 官网 — nginx 站点配置（独立端口 8080，与雅思的 80 端口并存）
# 服务器部署位置: /etc/nginx/sites-available/glowisd
#                 软链 -> /etc/nginx/sites-enabled/glowisd
# 作用: 反代 gunicorn (127.0.0.1:8000) + 直接 serve 静态/媒体文件

server {
    listen 0.0.0.0:8080;
    server_name _;

    client_max_body_size 20M;   # 产品照片 / 询价表单上传上限

    # collectstatic 产物（deploy 脚本 [5/6] 生成到 staticfiles/）
    location /static/ {
        alias /var/www/glowisd/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 产品照片（git 仓库中的 media/）
    location /media/ {
        alias /var/www/glowisd/media/;
        expires 30d;
    }

    # 其余请求 → gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
