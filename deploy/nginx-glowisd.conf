# Glowisd 官网 — nginx 站点配置（独立端口 8080，与雅思的 80 端口并存）
# 服务器部署位置: /etc/nginx/sites-available/glowisd
#                 软链 -> /etc/nginx/sites-enabled/glowisd
# 作用: 反代 gunicorn (127.0.0.1:8000) + 直接 serve 静态/媒体文件
#
# 缓存策略（性能版）:
#   HTML        → no-cache（每次 304 校验，内容更新立即生效）
#   /static/    → 30 天（URL 带 ?v=版本号，部署升版即失效）
#   /media/opt/ → 30 天（同上，由 scripts/make_webp.py 生成的 WebP 变体）
#   /media/     → 7 天（原图；后台换图会生成新文件名，不会串图）
# 压缩: 只压文本类（html/css/js/json/svg）；图片本身已压缩，再 gzip 只浪费 CPU

server {
    listen 0.0.0.0:8080;
    server_name _;

    client_max_body_size 20M;   # 产品照片 / 询价表单上传上限

    # —— 文件传输与连接复用（2 核机器上的基础优化）——
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 静态文件描述符缓存：省掉每次请求的 open()/stat()
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # —— 文本压缩 ——
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    # collectstatic 产物（deploy 脚本生成到 staticfiles/）
    # 注意：expires 与 add_header Cache-Control 同时写会发出两个 Cache-Control 头，
    # 这里只用其中一个来源。静态资源用 expires（自动带 Expires + max-age），
    # WebP 变体需要 immutable，改用 add_header 精确指定。
    location /static/ {
        alias /var/www/glowisd/staticfiles/;
        expires 30d;
        access_log off;
    }

    # WebP 变体（scripts/make_webp.py 生成；URL 带 ?v= 版本号）
    location /media/opt/ {
        alias /var/www/glowisd/media/opt/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 产品照片 / 站点图片原图
    location /media/ {
        alias /var/www/glowisd/media/;
        expires 7d;
        access_log off;
    }

    # 其余请求 → gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 注意:必须用 $http_host(保留端口),不能用 $host(丢端口)。
        # Django 6.1 CSRF Origin 校验是严格字符串比较,Django 期望的 Origin
        # 基于 Host 头;丢端口会导致浏览器 Origin(http://IP:8080) 与期望值
        # (http://IP) 不匹配 → 后台登录/所有 POST 一律 403 CSRF 失败。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用覆盖模式（$remote_addr）而非追加模式（$proxy_add_x_forwarded_for）：
        # 后台登录限流按 X-Forwarded-For 首个值取 IP，追加模式会把客户端伪造的
        # X-Forwarded-For 头拼在前面 → 攻击者每发一次请求换一个假 IP → 限流被绕过。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";   # HTML 页面每次校验，不缓存旧版
    }
}
