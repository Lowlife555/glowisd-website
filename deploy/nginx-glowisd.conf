# Glowisd 官网 — nginx 站点配置（独立端口 8080，与雅思的 80 端口并存）
# 服务器部署位置: /etc/nginx/sites-available/glowisd
#                 软链 -> /etc/nginx/sites-enabled/glowisd
# 作用: 反代 gunicorn (127.0.0.1:8000) + 直接 serve 静态/媒体文件
# V0.3.9 缓存策略: 全站 no-cache + ETag/304 校验，网站更新后访客立即可见

server {
    listen 0.0.0.0:8080;
    server_name _;

    client_max_body_size 20M;   # 产品照片 / 询价表单上传上限

    # collectstatic 产物（deploy 脚本 [5/6] 生成到 staticfiles/）
    location /static/ {
        alias /var/www/glowisd/staticfiles/;
        expires -1;             # no-cache: 每次 304 校验，logo/CSS 更新立即生效
    }

    # 产品照片（git 仓库中的 media/）
    location /media/ {
        alias /var/www/glowisd/media/;
        expires -1;             # no-cache: 产品图/水印更新立即生效
    }

    # 其余请求 → gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        # 注意:必须用 $http_host(保留端口),不能用 $host(丢端口)。
        # Django 6.1 CSRF Origin 校验是严格字符串比较,Django 期望的 Origin
        # 基于 Host 头;丢端口会导致浏览器 Origin(http://IP:8080) 与期望值
        # (http://IP) 不匹配 → 后台登录/所有 POST 一律 403 CSRF 失败。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";   # HTML 页面每次校验，不缓存旧版
    }
}
