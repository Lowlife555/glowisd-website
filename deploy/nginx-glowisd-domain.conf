# glowisd.cn 域名站点 — 与 IELTS(80 默认站)按 server_name 共存
# 服务器位置: /etc/nginx/sites-available/glowisd-domain → sites-enabled(软链)
# 域名上线: 80 = ACME 挑战 + 301 https; 443 = 反代 gunicorn(127.0.0.1:8000) + 静态/媒体
# 证书: /etc/letsencrypt/live/glowisd.cn/(certbot certonly --webroot 签发,certbot.timer 自动续期)
# 与 8080 老入口区别: 443 用 Host $host(无端口);8080 用 $http_host 保留端口 —— 保证 Django CSRF Origin 严格匹配
#
# 缓存/压缩策略与 8080 入口保持一致:
#   HTML no-cache；/static/ 与 /media/opt/ 30 天（URL 带 ?v= 版本号）；/media/ 原图 7 天

server {
    listen 80;
    server_name glowisd.cn www.glowisd.cn;

    # ACME HTTP-01 挑战目录(certbot renew 也走这里)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;       # 多资源并行下载（首屏 20+ 请求，HTTP/2 省掉队头阻塞）
                                # 注：服务器 nginx 为 1.24，不支持 1.25.1 才有的独立 http2 on; 写法
    server_name glowisd.cn www.glowisd.cn;

    ssl_certificate     /etc/letsencrypt/live/glowisd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glowisd.cn/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    location /static/ {
        alias /var/www/glowisd/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location /media/opt/ {
        alias /var/www/glowisd/media/opt/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/glowisd/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";
    }
}
