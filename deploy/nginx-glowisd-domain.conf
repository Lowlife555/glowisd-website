# glowisd.cn 域名站点 — 与 IELTS(80 默认站)按 server_name 共存
# 服务器位置: /etc/nginx/sites-available/glowisd-domain → sites-enabled(软链)
# V0.6.2 域名上线: 80 = ACME 挑战 + 301 https; 443 = 反代 gunicorn(127.0.0.1:8000) + 静态/媒体
# 证书: /etc/letsencrypt/live/glowisd.cn/(certbot certonly --webroot 签发,certbot.timer 自动续期)
# 与 8080 老入口区别: 443 用 Host $host(无端口);8080 用 $http_host 保留端口 —— 保证 Django CSRF Origin 严格匹配

server {
    listen 80;
    server_name glowisd.cn www.glowisd.cn;

    # ACME HTTP-01 挑战目录(certbot renew 也走这里)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name glowisd.cn www.glowisd.cn;

    ssl_certificate     /etc/letsencrypt/live/glowisd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glowisd.cn/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/glowisd/staticfiles/;
        expires -1;
    }

    location /media/ {
        alias /var/www/glowisd/media/;
        expires -1;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-cache";
    }
}
