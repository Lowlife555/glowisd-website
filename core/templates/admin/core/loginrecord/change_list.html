{% extends "admin/change_list.html" %}

{% block content %}
    <div style="display:flex;gap:16px;padding:18px 22px 6px;flex-wrap:wrap;">
        <div style="flex:1;min-width:160px;background:#fff;border:1px solid #e4e9f5;border-radius:4px;padding:16px 18px;">
            <div style="font-size:28px;font-weight:700;color:#162A87;">{{ cl.login_stats.today_count }}</div>
            <div style="font-size:13px;color:#5a6b9e;margin-top:4px;">今日登录次数</div>
        </div>
        <div style="flex:1;min-width:160px;background:#fff;border:1px solid #e4e9f5;border-radius:4px;padding:16px 18px;">
            <div style="font-size:28px;font-weight:700;color:#D2AE00;">{{ cl.login_stats.active_admin_count }}</div>
            <div style="font-size:13px;color:#5a6b9e;margin-top:4px;">活跃管理员（7天）</div>
        </div>
        <div style="flex:1;min-width:160px;background:#fff;border:1px solid #e4e9f5;border-radius:4px;padding:16px 18px;">
            <div style="font-size:28px;font-weight:700;color:#c0392b;">{{ cl.login_stats.fail_count_7d }}</div>
            <div style="font-size:13px;color:#5a6b9e;margin-top:4px;">失败登录（7天）</div>
        </div>
        <div style="flex:1;min-width:160px;background:#fff;border:1px solid #e4e9f5;border-radius:4px;padding:16px 18px;">
            <div style="font-size:28px;font-weight:700;color:#E67E22;">{{ cl.login_stats.anomaly_count }}</div>
            <div style="font-size:13px;color:#5a6b9e;margin-top:4px;">异常登录</div>
        </div>
    </div>
    {{ block.super }}
{% endblock %}
